# A release blocker: urgent priority, 2 GPUs, needed NOW.
apiVersion: batch/v1
kind: Job
metadata:
  name: hotfix-eval
  namespace: production
  labels:
    app: ai-demo
    kueue.x-k8s.io/queue-name: team-queue  # <- the only change teams make
    kueue.x-k8s.io/priority-class: urgent
spec:
  parallelism: 2
  completions: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      containers:
      - name: worker
        image: busybox:1.37
        command: ["sh", "-c", "echo \"hotfix eval (worker $JOB_COMPLETION_INDEX)\"; sleep 3600"]
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            nvidia.com/gpu: 1   # 1 GPU per worker
